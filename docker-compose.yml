# Separate legacy server edition. Personal deployments use docker-compose.personal.yml.
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      ALLOW_SERVER_WORKSPACE: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      AI_LAYOUT_ENABLED: ${AI_LAYOUT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-25}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      # Production defaults assume the loopback-bound Nginx frontend sits
      # behind a TLS-terminating proxy. docker-compose.local.yml overrides
      # these values for an intentionally HTTP-only local container stack.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      NODE_ENV: ${NODE_ENV:-production}
      RUN_MIGRATIONS: "true"
      PORT: 5000
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-104857600}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "job_worker.py"]
    environment:
      ALLOW_SERVER_WORKSPACE: "true"
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      NODE_ENV: ${NODE_ENV:-production}
      RUN_MIGRATIONS: "false"
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "role_healthcheck.py", "worker", "--max-age", "180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}

  maintenance:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "maintenance.py", "--delete-orphans"]
    environment:
      ALLOW_SERVER_WORKSPACE: "true"
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?PASSWORD_PEPPER is required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      NODE_ENV: ${NODE_ENV:-production}
      RUN_MIGRATIONS: "false"
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "role_healthcheck.py", "maintenance", "--max-age", "180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${MAINTENANCE_MEMORY_LIMIT:-512m}
    cpus: ${MAINTENANCE_CPU_LIMIT:-0.5}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_SERVER_WORKSPACE: "true"
    restart: unless-stopped
    environment:
      TRUSTED_EDGE_CIDR: ${TRUSTED_EDGE_CIDR:-127.0.0.1/32}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}

volumes:
  mysql_data:
  uploads_data:
