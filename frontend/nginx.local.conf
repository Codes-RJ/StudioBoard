# Static personal deployment: no API proxy, database, accounts, or uploads.
map $uri $workspace_robots {
  default "";
  ~^/(dashboard|upload|login|admin)(/|$) "noindex, follow";
}
map $uri $analytics_asset_cache {
  default "no-cache";
  ~^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|mjs|css|wasm|webp|jpg)$ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/wasm image/svg+xml application/json application/xml;
  add_header Cache-Control $analytics_asset_cache always;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag $workspace_robots always;
  # Explicit URL imports are direct HTTPS reads; parser workers are local.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' blob: 'wasm-unsafe-eval'" always;

  location = /api { return 404; }
  location /api/ { return 404; }
  location = /metrics { return 404; }
  error_page 404 /404.html;
  location = /404.html { internal; }
  location = / { try_files /index.html =404; }
  location = /privacy { try_files /privacy/index.html =404; }
  location = /how-it-works { try_files /how-it-works/index.html =404; }
  location = /terms { try_files /terms/index.html =404; }
  location = /dashboard { try_files /dashboard/index.html =404; }
  location = /upload { try_files /upload/index.html =404; }
  location = /login { try_files /login/index.html =404; }
  location = /admin { try_files /admin/index.html =404; }
  location ~ ^/(how-it-works|privacy|terms|dashboard|upload|login|admin)/$ { return 301 /$1$is_args$args; }
  location / { try_files $uri =404; }
}
