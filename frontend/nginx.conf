# Rendered by the official Nginx image. Identify the actual TLS edge peer;
# no arbitrary/private-network trust. Edge must replace forwarding headers.
set_real_ip_from ${TRUSTED_EDGE_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;
geo $realip_remote_addr $analytics_trusted_edge {
  default 0;
  ${TRUSTED_EDGE_CIDR} 1;
}
map "$analytics_trusted_edge:$http_x_forwarded_proto" $analytics_forwarded_proto {
  default $scheme;
  "1:https" https;
}

map $uri $analytics_asset_cache {
  default "no-cache";
  ~^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|mjs|css|wasm|webp|jpg)$ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/wasm image/svg+xml application/json application/xml;
  add_header Cache-Control $analytics_asset_cache always;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' blob: 'wasm-unsafe-eval'" always;

  # Health endpoints live outside the mounted FastAPI /api sub-application.
  # Keep the public same-origin probe stable while preserving that separation.
  location /api/health/ {
    proxy_pass http://backend:5000/health/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $analytics_forwarded_proto;
  }

  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $analytics_forwarded_proto;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
